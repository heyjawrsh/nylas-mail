title = "Refactor sweep"
description = "Cleans up what the other stories and their reviews deferred. Its scope is set from their plans when it starts, and it is cleanup only."
verify = "The harness and Vitest pass on all three builds after the cleanup."
covers = ["R3"]
after = [1, 2, 3, 4, 5, 6, 7, 8]
hitl = false
risk = "low"
