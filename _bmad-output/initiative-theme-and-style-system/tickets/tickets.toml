description = "The four short style specs are written at its start, the Classic style lays out every surface shipped so far, and the shared component kit freezes at its end for epics 7 to 9 and 11, in an installable pre-release build."
covers = ["R2", "R3", "R6", "R7", "R15", "R18", "R19", "R20", "R21", "R32"]
parts = { R2 = "Classic with every theme built so far", R3 = "Classic places or hides every region", R6 = "the Classic style, with narrow-list row heights", R7 = "Classic lays out every surface shipped so far", R15 = "Classic's border-strong edges", R18 = "Classic's rows per density", R19 = "Classic meets the obligations", R20 = "Classic's title bar", R21 = "Classic's reflow ladder", R32 = "Classic's by-eye check" }
after = [
  { epic = 2, needs = "the Loft surfaces and shared components Classic arranges" },
