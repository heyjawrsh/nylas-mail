# epic-style-contract stories, planned 2026-11-12. Table order is build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "The Classic style lays out the list through the contract"
description = "Adds the nylasStyle manifest and the style loader (separate from the package stylesheet loader that 1.7 changes, and using 1.1's layer wrapping for the style layer), the Classic style package, data-region on the list's WorkspaceStore locations, and the baseline --row-height defaults. A probe on each look root feeds ListTabular's itemHeight. Seeds 10,000 threads into the fixture account."
verify = "Changing Classic's --row-height-thread-list in its style CSS and reloading changes thread row height in the running app, and the list still scrolls virtualised through the 10,000 fixture threads."
covers = ["R2", "R3"]
after = ["1.8", "13.4"]
hitl = false
risk = "high"
notes = ["Tracer bullet. Extra check: the probe re-reads after a look change without a reload."]

[[entry]]
id = 2
type = "story"
title = "Density and text size set list row heights"
description = "Adds the three density levels as --density-scale on look roots, per-density --row-height-<list> in Classic computed from its spacing and line-height roles, and the probe re-read on look change, font load and resize. The hard-coded 36 and 39px heights go, and the narrow 85px branch becomes a baseline default under a container query. The JS switch to narrow columns stays, and epic-classic-style sets the spec values. Rows are at least 24px."
verify = "At each density and at 87.5% and 150% text, thread and draft rows change height with no clipped text in the real app, narrow windows keep multi-line rows, and no row is shorter than 24px."
covers = ["R3"]
after = [1, "1.2", "1.5", "1.10"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Style geometry comes from the manifest"
description = "Adds the style-geometry runtime: manifest region widths drive ResizableRegion, the window minimum is set through the shell adapter, layoutMode split forces split pane in memory and hides the mode switch, and data-reflow switches to single pane with Back. containerStyles and setMinimumWidth in sheet.jsx stop applying."
verify = "Specs cover the runtime. In the real app the window can't shrink below Classic's manifest minimum, dragging a region stops at its manifest bounds, a fixture breakpoint switches to single pane with Back, a fixture split-only style hides the mode switch, and core.workspace.mode still toggles in Classic."
covers = ["R7"]
after = [1, "1.9"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Every region exists, overlay and toast included"
description = "Adds data-region to the nav, reading and rail locations, adds the Overlay and Toast WorkspaceStore locations as regions styles can place or hide, and makes manifest hide take precedence over core.workspace.hiddenLocations."
verify = "Every region carries its data-region in Classic, a fixture component registered into each new location renders, and a fixture style hiding a region removes it."
covers = ["R2"]
after = [1, 3]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Every window is frameless on every OS"
description = "Sets titleBarStyle hidden with titleBarOverlay on Windows and Linux and setWindowButtonPosition on macOS for every window window-launcher opens, popouts included. Adds data-region titlebar over the Toolbar locations as the drag region, shell-chrome.css with the title-bar insets, and the set-window-chrome channel, re-sent on hot-window activation. Removes ToolbarWindowControls and the feature process.platform chrome checks. Onboarding stays 900x600. The person checks the installed build on each OS."
verify = "On macOS, Windows and Linux, the installed build's main window and a composer popout show no native frame, the OS controls sit where the style's titlebarHeight places them, and dragging the top bar moves the window."
covers = ["R5"]
after = [1, 3, "1.9"]
hitl = true
risk = "high"
notes = ["A person checks the installed build on each of the three OSes. Extra check: on Windows at 150% display scaling the overlay controls don't cover the toolbar's last button."]

[[entry]]
id = 6
type = "story"
title = "Region components read through the preview data provider"
description = "Adds the React context provider that defaults to the live stores, routes every region component's reads through it, and adds src/appearance/preview-fixtures/ and the preview's virtual width plus transform. Preview roots are inert, and popovers and modals portal into the nearest look root."
verify = "A preview root at a virtual width renders the thread list and message view from fixtures while the live app shows real data, nothing in the preview takes focus or input, and a popover opened in it stays inside it."
covers = ["R8"]
after = [1, 2]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Lint and the loader enforce the style obligations"
description = "Adds pnpm lint rules and the matching style-loader check: no hex literals, no theme ids, no physical left/right, no declared role properties, no unlayered CSS, flags written :scope[data-…], and font sizes only through the var(--type-<role>-size) roles, which carry --text-scale (architecture AD-29). Adds the shared two-tone focus ring at 3:1 in the baseline layer."
verify = "Fixture styles breaking each rule fail lint and are rejected by the loader, the repo passes, and the focus ring passes 3:1 and is never clipped in Classic light and dark."
covers = ["R1", "R4"]
after = [1, "1.7"]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "The sweep runs every existing combination"
description = "Extends the real-app harness into the sweep: every existing style × theme × density × variant across every window type, screenshots and overflow checks, direct contrast-pair checks, axe on every high-contrast variant that exists, signals driven through the AppearanceSignals override, the @scope limit fixture, and the RTL pass once per style at its native theme. Sets the overflow and diff thresholds and records the first performance budgets."
verify = "In Linux CI the sweep runs every combination that exists, a fixture that overflows, fails a pair or leaks style CSS past its @scope limit fails the run, and the thresholds and budgets are written in the harness config."
covers = ["R4", "R6"]
after = [2, 3, 4, 5, 6, 7, "1.9", "13.8"]
hitl = false
risk = "high"
notes = ["Extra check: break one role in a fixture theme and confirm exactly the expected combinations fail."]

[[entry]]
id = 9
type = "story"
title = "Refactor sweep"
description = "Cleans up what the other stories and their reviews deferred. Its scope is set from their plans when it starts, and it is cleanup only."
verify = "The sweep and Vitest pass in an installable pre-release build after the cleanup."
covers = ["R2"]
after = [1, 2, 3, 4, 5, 6, 7, 8]
hitl = false
risk = "low"
