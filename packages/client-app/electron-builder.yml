# Unsigned pre-release builds for macOS, Windows and Linux (epic-platform-baseline).
# Signing, notarisation and auto-update are out of scope.
# Build with `pnpm --filter nylas-mail dist:<mac|win|linux>`. predist:* builds
# the renderer bundles first; scripts/dist.mjs then rebuilds the native modules
# for the host, pass or fail (the mac x64 leg leaves them x64), and runs the
# public-build check (scripts/check-public-build.mjs) on dist/.
# Build Windows and Linux on their own OS (CI does, see .github/workflows/dist.yml)
# or in a container on a clean `git archive` copy, never on a mac working tree.
#
# The mac build is unsigned, so Gatekeeper blocks a double-click. Open it with
# right-click › Open, or clear the quarantine flag:
#   xattr -dr com.apple.quarantine "/Applications/Nylas Mail.app"
#
# Matches the bundle id the app hard-codes (default-client-helper.js,
# native-notifications.js).
appId: com.nylas.nylas-mail
productName: Nylas Mail
copyright: Copyright (C) 2014-2017 Nylas, Inc. All rights reserved.

directories:
  output: dist
  buildResources: build/resources

files:
  - package.json
  - src/**/*
  - static/**/*
  - keymaps/**/*
  - menus/**/*
  - dot-nylas/**/*
  - internal_packages/**/*
  # client-sync is a symlink into the workspace; a real copy is added below.
  # Its dependencies ship because client-app depends on it (workspace:*).
  - "!internal_packages/client-sync{,/**/*}"
  # licensed fonts never ship in public builds (architecture AD-17)
  - "!internal_packages/nylas-private-fonts{,/**/*}"
  - "!**/spec{,/**/*}"
  - "!**/*.md"
  - "!**/docs{,/**/*}"
  - "!**/*.{gyp,cc,h,map}"
  # FileSets go last: string patterns after one don't apply to the app files
  - from: ../client-sync
    to: internal_packages/client-sync
    filter:
      - "**/*"
      - "!node_modules{,/**/*}"
      - "!spec{,/**/*}"
      - "!coverage{,/**/*}"

# Native binaries and the esbuild executable can't run from inside the asar.
asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/esbuild/**/*"
  - "**/node_modules/@esbuild/**/*"

protocols:
  - name: Nylas Protocol
    schemes: [nylas]
  - name: Mailto Protocol
    schemes: [mailto]

mac:
  category: public.app-category.business
  icon: build/resources/mac/nylas.icns
  # unsigned: no identity, no notarisation, no hardened runtime
  identity: null
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

# Unsigned: no certificate is configured, so nothing is signed.
win:
  icon: build/resources/win/nylas.ico
  target:
    - target: nsis
      arch: [x64]

linux:
  icon: build/resources/linux/icons
  category: Network;Email
  mimeTypes: [x-scheme-handler/mailto]
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

deb:
  maintainer: Joshua Butner <53810+heyjawrsh@users.noreply.github.com>
