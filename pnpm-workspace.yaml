packages:
  # Ratchet: packages join the workspace as they are converted off the
  # 2017 manifests (babel-node/jasmine/lerna). Legacy manifests stay
  # unresolvable (github forks, node-6 native tarballs) until their
  # conversion round, so they are NOT workspace members yet.
  - "packages/isomorphic-core"
  - "packages/cloud-core"
  - "packages/cloud-workers"
  - "packages/cloud-api"
  - "packages/client-sync"
  - "packages/client-app"

# Packages allowed to run install scripts (pnpm 11). Native modules and
# binary downloaders only.
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  sqlite3: true
  unix-dgram: true
  # @scarf/scarf is opt-out telemetry — never allow its postinstall
  "@scarf/scarf": false
  # Squirrel.Windows installer helper pulled in by electron-builder; the
  # Windows build is NSIS, which doesn't use it
  electron-winstaller: false
  # postinstall only prints a message
  es5-ext: false

# Install both macOS esbuild binaries so the dist:mac build can ship the
# require-time compiler for Apple silicon and Intel alike.
supportedArchitectures:
  os: [current, darwin]
  cpu: [current, arm64, x64]

verifyDepsBeforeRun: false

minimumReleaseAgeExclude:
  - electron@45.3.1
