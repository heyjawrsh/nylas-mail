name: modernize-ci
on:
  push:
    branches: [modernize/current]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # version comes from package.json's packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check:react
      - run: pnpm -r run test
      - run: pnpm lint
